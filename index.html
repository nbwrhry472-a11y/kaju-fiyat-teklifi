<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaju Reklam Fiyat Teklifi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;background:#0b0d0c;color:#fff;font-family:Arial}.w{max-width:850px;margin:auto;padding:18px}.c{background:#151816;border:1px solid #303530;border-radius:16px;padding:18px;margin:14px 0}h1{margin-bottom:4px}.m{color:#9ca39e}label{display:block;color:#aaa;margin:12px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #383d39;background:#0d100e;color:#fff;font-size:16px}textarea{min-height:80px}button{width:100%;padding:14px;border:0;border-radius:11px;background:#38c97b;font-weight:bold;font-size:16px;margin-top:14px}.r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #303530}.big{font-size:25px;font-weight:bold}.ok{color:#38c97b}.err{color:#ff6b6b}
</style></head><body><div class="w"><h1>Kaju Reklam Fiyat Teklifi</h1><div class="m">Teklif oluşturma ve fiyatlandırma</div>
<div class="c"><b>İlk Kurulum</b><label>Supabase Publishable Key</label><input id="key" type="password" placeholder="sb_publishable_..."><button onclick="connect()">Bağlan ve Kaydet</button><p id="st" class="m"></p></div>
<div class="c"><b>Müşteri Bilgileri</b><label>Müşteri / Firma</label><input id="musteri"><label>Telefon</label><input id="telefon"><label>E-posta</label><input id="email"></div>
<div class="c"><b>Ürün</b><label>Ürün seçimi</label><select id="urun" onchange="calc()"><option value="">Ürün seçin</option></select><label>Adet</label><input id="adet" type="number" value="1000" oninput="calc()"><label>KDV (%)</label><input id="kdv" type="number" value="20" oninput="calc()"><label>Notlar</label><textarea id="notlar"></textarea></div>
<div class="c"><b>Teklif Özeti</b><div class="r"><span>Ara Toplam</span><b id="ara">0,00 TL</b></div><div class="r"><span>KDV</span><b id="kt">0,00 TL</b></div><div class="r"><span>Genel Toplam</span><span id="genel" class="big">0,00 TL</span></div><button onclick="saveOffer()">Teklifi Kaydet</button><p id="saveSt"></p></div>
</div><script>
const URL='https://bczhmrabfggifwuctuot.supabase.co';let db,products=[];
const tl=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(n||0));
async function connect(){
const keyEl=document.getElementById('key'),stEl=document.getElementById('st'),urunEl=document.getElementById('urun');
let k=keyEl.value.trim();
if(!k){stEl.className='err';stEl.textContent='Anahtarı yapıştırın.';return}
try{
stEl.className='m';stEl.textContent='Bağlanıyor...';
localStorage.setItem('kaju_key',k);
db=window.supabase.createClient(URL,k);
let {data,error}=await db.from('urun_fiyatlari').select('*');
if(error)throw error;
products=(data||[]).filter(x=>!x.teklif_no);
urunEl.innerHTML='<option value="">Ürün seçin</option>';
products.forEach((p,i)=>{let n=p.urun||p.malzeme||p.urun_adi||p.kod||('Ürün '+p.id),f=p.fiyat??p.toplam_fiyat??p.birim_fiyat??0;urunEl.innerHTML+=`<option value="${i}">${n} — ${tl(f)}</option>`});
stEl.className='ok';stEl.textContent=products.length+' ürün yüklendi.';
}catch(e){stEl.className='err';stEl.textContent='Bağlantı hatası: '+(e?.message||e)}
}
function calc(){const urunEl=document.getElementById('urun'),kdvEl=document.getElementById('kdv');let p=urunEl.value===''?null:products[+urunEl.value],base=p?Number(p.fiyat??p.toplam_fiyat??p.birim_fiyat??0):0,v=Number(kdvEl.value||0),tax=base*v/100;document.getElementById('ara').textContent=tl(base);document.getElementById('kt').textContent=tl(tax);document.getElementById('genel').textContent=tl(base+tax);return{p,base,tax,total:base+tax}}
async function saveOffer(){if(!db)return saveSt.textContent='Önce bağlantıyı kurun.';let c=calc();if(!c.p)return saveSt.textContent='Ürün seçin.';let no='KT'+new Date().getFullYear().toString().slice(-2)+String(Date.now()).slice(-6),name=c.p.urun||c.p.malzeme||c.p.urun_adi||c.p.kod||('Ürün '+c.p.id);let row={teklif_no:no,musteri:musteri.value||null,telefon:telefon.value||null,email:email.value||null,urun:name,adet:+adet.value,toplam_fiyat:c.base,kdv_orani:+kdv.value,genel_toplam:c.total,notlar:notlar.value||null,durum:'Aktif'};let {error}=await db.from('urun_fiyatlari').insert(row);saveSt.className=error?'err':'ok';saveSt.textContent=error?('Kaydedilemedi: '+error.message):('Teklif kaydedildi: '+no)}
let k=localStorage.getItem('kaju_key');if(k){document.getElementById('key').value=k;connect()}
</script></body></html>
